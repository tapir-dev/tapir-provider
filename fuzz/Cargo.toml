[package]
name = "tapir-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# `tapir` is the crate under test; the skeleton harness doesn't call into it yet,
# so cargo-machete can't see the dependency as used. Keep it ignored.
[package.metadata.cargo-machete]
ignored = ["tapir-provider"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tapir-provider]
path = ".."

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false
