[workspace]
# The root crate is the shipped library; `xtask` is a dev-only tool (the model
# catalog generator). `default-members` keeps `xtask` out of the default build,
# test, and clippy runs — it is built on demand via `cargo run -p xtask`.
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "tapir-provider"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Library includes models for agentic workflow"

[features]
default = ["reqwest"]
# Default reqwest-backed HttpClient transport.
reqwest = ["dep:reqwest"]
# Compile the Anthropic Provider into the crate.
anthropic = ["dep:getrandom"]
# Compile the OpenAI Provider and embeddings into the crate.
openai = []
# Umbrella feature for the model catalog's type layer: Model, Model Entry,
# Compat, and the catalog enums. Off by default; the ModelId/ProviderId
# newtypes are always compiled because the Registry's ProviderInfo carries a
# ProviderId regardless of this feature.
models = []
# User-supplied override layer for the catalog: a TOML file, highest precedence
# in the Catalog merge (user > fetched > baseline). Requires `models`.
models-user-config = ["models", "dep:toml"]
# Runtime discovery layer for the catalog: a live per-Provider `GET /models`
# fetch over the HttpClient seam plus an on-disk JSON cache, middle precedence
# in the Catalog merge (user > fetched > baseline). Requires `models`.
models-fetch = ["models"]
# File-backed Token Store that serializes Credentials as TOML, guarded by an
# OS file lock so concurrent processes coordinate reads, writes, and refresh.
token-store-file = ["dep:toml", "dep:fs4"]
# In-crate HttpClient test double for driving Providers without a network.
test-utils = []

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cryptographic entropy for the OAuth PKCE verifier and CSRF state.
getrandom = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
], optional = true }
# TOML (de)serialization for the file-backed Token Store.
toml = { version = "0.8", optional = true }
# OS-level file locking so concurrent processes coordinate on the store file.
fs4 = { version = "1", default-features = false, features = [
    "sync",
], optional = true }

# Streaming extended-thinking example; needs the catalog and the Anthropic
# Provider, so it is skipped unless both features are on.
[[example]]
name = "quick_start"
required-features = ["models", "anthropic"]

# Catalog-querying example; needs the model catalog type layer.
[[example]]
name = "querying_models"
required-features = ["models"]

# Auth-resolution inspection example; needs the Model Registry and a Provider.
[[example]]
name = "auth"
required-features = ["models", "openai"]

# Provider Config reaching Resolved Auth; needs the Model Registry and a Provider.
[[example]]
name = "credential_store"
required-features = ["models", "openai"]

# Live Model-list refresh example; needs the fetch layer and both Providers.
[[example]]
name = "dynamic_providers"
required-features = ["models-fetch", "openai", "anthropic"]

# Compiled-in Provider set example; needs both Providers.
[[example]]
name = "provider_factories"
required-features = ["anthropic", "openai"]

[[example]]
name = "transform_request_headers"
required-features = ["anthropic"]

# Cached multi-turn request example; needs the catalog (for cache rates) and the
# Anthropic Provider.
[[example]]
name = "cached_request"
required-features = ["models", "anthropic"]

# Offline tool-call loop over a scripted Provider; uses only core message/request
# types, so it needs no crate features. `schemars` (a dev-dependency) derives one
# tool's argument schema from a typed struct.
[[example]]
name = "tools"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Derives a tool's JSON Schema from a typed args struct in the `tools` example.
schemars = "1.0"

[package.metadata.docs.rs]
all-features = true
