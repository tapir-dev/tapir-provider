[package]
name = "tapir-provider"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Library includes models for agentic workflow"

[package.metadata.cargo-machete]
ignored = ["fuzz"]

[features]
default = ["reqwest"]
# Default reqwest-backed HttpClient transport.
reqwest = ["dep:reqwest"]
# Compile the Anthropic Provider into the crate.
anthropic = ["dep:getrandom"]
# In-crate HttpClient test double for driving Providers without a network.
test-utils = []

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cryptographic entropy for the OAuth PKCE verifier and CSRF state.
getrandom = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
